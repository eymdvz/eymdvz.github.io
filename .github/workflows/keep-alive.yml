name: Supabase Keep Alive
on:
  schedule:
    - cron: '0 0 * * 1,4' # This runs at midnight every Monday and Thursday
  workflow_dispatch:      # This button lets you test it manually

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Admins Table
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/admins?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
